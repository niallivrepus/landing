<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chess</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#ffffff;color:#111111;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #root{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100%;min-height:100%;padding:14px 12px 22px;gap:8px}

  .player-row{display:flex;align-items:center;gap:10px;width:min(100%,640px);padding:8px 14px;border-radius:14px;border:1px solid rgba(17,17,17,0.08);transition:background .25s ease,border-color .25s ease;min-height:48px;flex-shrink:0}
  .player-row.active{background:rgba(17,17,17,0.05);border-color:rgba(17,17,17,0.22)}
  .player-row .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
  .player-row .avatar.oo{background:#0066FF;border:1px solid rgba(255,255,255,0.2);box-shadow:inset 0 1px 2px rgba(255,255,255,0.12)}
  .player-row .avatar.oo svg{width:26px;height:31px;display:block;margin-top:1px}
  .player-row .avatar.you{background:rgba(17,17,17,0.08);font-size:15px;font-weight:600}
  .player-row .info{display:flex;flex-direction:column;min-width:0;flex-shrink:0}
  .player-row .name{font-size:14px;font-weight:600}
  .player-row .sub{font-size:12px;opacity:0.55;font-weight:500}
  .player-row .meta{margin-left:auto;display:flex;align-items:center;gap:8px}
  .captures{font-size:14px;letter-spacing:1px;opacity:0.8;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}

  #oo-quip{text-align:center;font-size:13px;font-weight:500;color:rgba(17,17,17,0.55);width:min(100%,640px);line-height:1.35;min-height:18px;font-style:italic;transition:opacity 0.3s ease;flex-shrink:0}

  .thinking{display:none;align-items:center;gap:3px}
  .player-row.thinking-on .thinking{display:flex}
  .thinking i{width:5px;height:5px;border-radius:50%;background:#111;opacity:0.35;animation:tdot 1.1s infinite ease-in-out}
  .thinking i:nth-child(2){animation-delay:.18s}
  .thinking i:nth-child(3){animation-delay:.36s}
  @keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-3px);opacity:.85}}

  #status{text-align:center;font-size:13px;opacity:0.62;width:min(100%,640px);line-height:1.4;min-height:18px;font-weight:500;flex-shrink:0}
  canvas{display:block;touch-action:none;-webkit-tap-highlight-color:transparent;border-radius:12px;box-shadow:0 1px 2px rgba(17,17,17,0.06),0 8px 28px rgba(17,17,17,0.07);flex-shrink:0}
</style>
</head>
<body>
<div id="root">
  <div class="player-row" id="row-oo">
    <div class="avatar oo" aria-hidden="true">
      <svg viewBox="0 0 39 46" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14.874 2C15.283 2 15.684 2.03547 16.0742 2.10156C24.2 2.40708 31.1575 7.83523 34.4824 15.6387C35.8145 18.3494 36.5712 21.4563 36.5713 24.7588C36.5713 24.956 36.5669 25.1528 36.5615 25.3486C36.5672 25.5773 36.5713 25.8068 36.5713 26.0371H36.5322C35.9378 36.0024 28.4444 43.8816 19.2861 43.8818C9.73945 43.8818 2 35.3201 2 24.7588C2.0001 19.0454 4.2657 13.9181 7.85645 10.4141C7.7812 9.99873 7.73926 9.57081 7.73926 9.13379C7.73952 5.19375 10.934 2.00016 14.874 2Z" fill="url(#chess_oo_body)"/>
        <ellipse cx="19.4223" cy="16.9144" rx="3.37091" ry="5.25236" fill="#FFFFFF"/>
        <ellipse cx="29.5921" cy="16.9143" rx="2.86138" ry="5.25236" transform="rotate(-6.90938 29.5921 16.9143)" fill="#FFFFFF"/>
        <defs>
          <linearGradient id="chess_oo_body" x1="2" y1="43.882" x2="40.5535" y2="39.8229" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7700FF"/>
            <stop offset="1" stop-color="#B300FF"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="info">
      <div class="name">OO</div>
      <div class="sub">Black</div>
    </div>
    <div class="meta">
      <span class="captures" id="captures-oo"></span>
      <span class="thinking"><i></i><i></i><i></i></span>
    </div>
  </div>

  <div id="oo-quip"></div>

  <canvas id="game"></canvas>

  <div id="status">Your move.</div>

  <div class="player-row" id="row-you">
    <div class="avatar you">Y</div>
    <div class="info">
      <div class="name">You</div>
      <div class="sub">White</div>
    </div>
    <div class="meta">
      <span class="captures" id="captures-you"></span>
    </div>
  </div>
</div>
<script src="scene.js"></script>
</body>
</html>
