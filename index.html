<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Drop legacy root-scoped service workers: the desktop web client used to register
      `/sw.js` with scope `/` on jokuh.com. After the combined deploy, marketing HTML
      lives at `/` while the client (and its PWA) lives under `/sandbox/`. A stale `/`
      worker can keep serving cached client shell (wrong logo / not the landing site).
      Only clear workers that control the site root; `/sandbox/*` registrations stay.
    -->
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var path = window.location.pathname || "/";
        if (path.startsWith("/sandbox")) return;
        var origin = window.location.origin;
        var rootScope = origin + "/";
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            regs.forEach(function (reg) {
              var scope = reg.scope || "";
              if (scope === rootScope || scope === origin) {
                reg.unregister();
              }
            });
          })
          .catch(function () {});
      })();
    </script>
    <script>
      (function () {
        var mediaByPath = {
          "/blurbs": {
            poster: "/product-hero/blurbs-poster.webp",
          },
          "/messages": {
            poster: "/product-hero/texts.webp",
          },
        };
        var path = window.location.pathname.replace(/\/+$/, "") || "/";

        function addLink(rel, href, fetchPriority) {
          var link = document.createElement("link");
          link.rel = rel;
          link.as = "image";
          link.href = href;
          if (fetchPriority) link.setAttribute("fetchpriority", fetchPriority);
          document.head.appendChild(link);
        }

        var media = mediaByPath[path];
        if (media) addLink("preload", media.poster, "high");

        // Story/about art is multi-MB — only warm it on the routes that render it.
        if (path === "/about" || path.indexOf("/stories") === 0) {
          addLink("preload", "/story-art/maren-workspace.png", "high");
        }
        if (path.indexOf("/stories") === 0) {
          addLink("prefetch", "/story-art/maren-tulum-coast.png");
          addLink("prefetch", "/story-art/maren-tulum-kitchen.png");
          addLink("prefetch", "/story-art/maren-tulum-call.png");
          addLink("prefetch", "/story-art/maren-tulum-bungalow.png");
        }
      })();
    </script>
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Jokuh newsroom and stories RSS"
      href="/rss.xml"
    />
    <title>Jokuh — a private workspace with your own AI</title>

    <meta

    <!-- Organization JSON-LD — keep description identical to SITE_PRODUCT_SENTENCE. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Jokuh",
        "url": "https://www.jokuh.com/",
        "description": "Jokuh is a private workspace with your own AI, OO, that remembers your calls, chats, and files — without giving that context to anyone else."
      }
    </script>
  </head>
  <body>
    <script>
      (function () {
        var k = "jokuh-landing-theme-v2";
        var stored = null;
        try {
          stored = localStorage.getItem(k);
        } catch (e) {}
        var resolved =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        var root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(resolved);
        root.setAttribute("data-theme", resolved);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta)
          meta.setAttribute("content", resolved === "dark" ? "#000000" : "#ffffff");
      })();
    </script>
    <!--
      Crawler-visible homepage copy inside #root. React replaces this on hydrate.
      Required so `curl https://www.jokuh.com/` still contains the H1.
    -->
    <div id="root">
      <h1>Your mind. Your machine.</h1>
      <p>
        Jokuh is a private workspace with your own AI, OO, that remembers your calls, chats, and files — without giving that context to anyone else.
      </p>
      <p><a href="/download">Get started</a></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
